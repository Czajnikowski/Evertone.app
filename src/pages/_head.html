<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
{{alternates}}
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:title" content="{{ogTitle}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:site_name" content="Evertone">
  <meta property="og:image" content="https://evertone.app/assets/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Evertone">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:locale" content="{{ogLocale}}">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="{{root}}assets/favicon.png">
  <link rel="apple-touch-icon" href="{{root}}assets/apple-touch-icon.png">
  <link rel="stylesheet" href="{{root}}assets/base.css">
  <link rel="stylesheet" href="{{root}}assets/style.css">
  <script src="{{root}}assets/theme.js"></script>
  <script src="{{root}}assets/lang.js" data-root="{{root}}" data-lang="{{code}}" data-page="{{file}}"></script>
</head>
<body>
  <a class="skip" href="#main">{{nav.skip}}</a>

  <header class="top wrap">
    <a class="brand" href="{{home}}"><img src="{{root}}assets/icon-512.png" alt="">Evertone</a>
    <nav aria-label="{{nav.main}}">
{{navLinks}}
      <details class="lang-menu">
        <summary><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg><span class="sr">{{nav.language}}: </span><span class="lang-name">{{nativeName}}</span></summary>
        <ul>
{{languageLinks}}
        </ul>
      </details>
      <button type="button" class="theme-toggle" data-system="{{theme.system}}" data-light="{{theme.light}}" data-dark="{{theme.dark}}"><svg class="system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/></svg><svg class="light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg></button>
    </nav>
  </header>
